<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}

body{
background:#f4f6f9;
}

/* Navbar */

header{
background:#2c3e50;
padding:15px 0;
}

nav ul{
display:flex;
justify-content:center;
gap:40px;
}

nav li{
list-style:none;
}

nav a{
text-decoration:none;
color:white;
font-size:18px;
padding:8px 15px;
border-radius:5px;
transition:0.3s;
}

nav a:hover{
background:#3498db;
}

/* Form section */

main{
height:80vh;
display:flex;
justify-content:center;
align-items:center;
}

form{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.2);
display:flex;
flex-direction:column;
gap:20px;
width:300px;
}

input{
padding:10px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
padding:10px;
background:#3498db;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

</style>
</head>

<body>

<header>
<nav>
<ul>
<li><a href="/">Shop</a></li>
<li><a href="/add-products">Add Products</a></li>
</ul>
</nav>
</header>

<main>

<form action="/product" method="POST">

<h2>Add Product</h2>

<input type="text" name="addProduct" placeholder="Enter product name" required>

<button type="submit">Submit</button>

</form>

</main>

</body>
</html>
